services:
  db:
    image: postgres:16-alpine
    container_name: ai_library_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_library_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
